<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sunset Survivors - Roguelite Auto-Shooter</title>
    <meta name="description" content="Roguelite de sobrevivência com tema de velho oeste bang bang inspirado em Sunset Riders. Hordas de bandidos, Simon Greedwell e recompensas lendárias!" />
    
    <!-- Google Fonts: 16-bit Arcade Pixel Font, Western Woodcut & Roboto Slab -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto+Slab:wght@700;900&family=Rye&display=swap" rel="stylesheet" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
      }

      body {
        background-color: #070403;
        background-image: 
          radial-gradient(circle at 50% 30%, #2b140a 0%, #070403 70%),
          repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.4) 3px);
        color: #f7e7c4;
        font-family: 'Press Start 2P', monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
      }

      #arcade-cabinet {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px;
        background: linear-gradient(180deg, #452b14 0%, #23140a 100%);
        border: 4px solid #8b5a2b;
        border-radius: 12px;
        box-shadow: 
          0 0 35px rgba(0, 0, 0, 0.9),
          inset 0 0 15px rgba(0, 0, 0, 0.8),
          0 0 20px rgba(245, 197, 24, 0.2);
        max-width: 98vw;
        max-height: 98vh;
      }

      #game-container {
        position: relative;
        width: 960px;
        height: 600px;
        max-width: 94vw;
        max-height: 84vh;
        border: 3px solid #140a05;
        border-radius: 6px;
        overflow: hidden;
        background-color: #000;
        box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9);
      }

      canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-crisp-edges;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      #cabinet-footer {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 8px;
        font-size: 10px;
        color: #c49a55;
        text-shadow: 1px 1px 0 #000;
      }

      .footer-tag {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .footer-btn {
        background: #2b1d0c;
        color: #f5c518;
        border: 2px solid #8b5a2b;
        padding: 5px 12px;
        font-family: 'Press Start 2P', monospace;
        font-size: 9px;
        cursor: pointer;
        border-radius: 4px;
        transition: all 0.15s ease;
      }

      .footer-btn:hover {
        background: #452b14;
        color: #ffe066;
        box-shadow: 0 0 8px rgba(245, 197, 24, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="arcade-cabinet">
      <div id="game-container"></div>
      <div id="cabinet-footer">
        <div class="footer-tag">
          <span>★ SUNSET SURVIVORS ★</span>
        </div>
        <div style="font-size: 8px; color: #a38a74;">
          WASD / SETAS / TOUCH JOYSTICK
        </div>
        <div>
          <button id="fullscreen-btn" class="footer-btn">⛶ TELA CHEIA</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
    <script>
      const fsBtn = document.getElementById('fullscreen-btn');
      if (fsBtn) {
        fsBtn.addEventListener('click', () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
            fsBtn.textContent = '🗗 SAIR';
          } else {
            document.exitFullscreen().catch(() => {});
            fsBtn.textContent = '⛶ TELA CHEIA';
          }
        });
      }
    </script>
  </body>
</html>
