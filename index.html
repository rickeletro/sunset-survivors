<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sunset Survivors - Roguelite Auto-Shooter</title>
    <meta name="description" content="Roguelite de sobrevivência com tema de velho oeste bang bang inspirado em Sunset Riders. Hordas de bandidos, Simon Greedwell e recompensas lendárias!" />
    
    <style>
      @font-face { font-family: 'Rye'; src: url('/assets/fonts/rye/Rye-Regular.ttf') format('truetype'); font-display: swap; }
      @font-face { font-family: 'Press Start 2P'; src: url('/assets/fonts/pressstart2p/PressStart2P-Regular.ttf') format('truetype'); font-display: swap; }
      @font-face { font-family: 'Roboto Slab'; src: url('/assets/fonts/robotoslab/RobotoSlab-Variable.ttf') format('truetype'); font-weight: 100 900; font-display: swap; }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
      }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #070403;
        color: #f7e7c4;
        font-family: 'Press Start 2P', monospace;
        overflow: hidden;
      }

      #game-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #070403;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      canvas {
        display: block;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-crisp-edges;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Allow pressing 'F' to toggle fullscreen
      window.addEventListener('keydown', (e) => {
        if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey && !e.altKey) {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen().catch(() => {});
          }
        }
      });
    </script>
  </body>
</html>
